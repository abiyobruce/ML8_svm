<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title description">
  <title id="title">Linear SVM decision boundary and margins</title>
  <desc id="description">A two dimensional diagram showing the decision boundary x1 plus x2 equals zero, two parallel margin lines, support vectors, and the normal vector w.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d">Linear SVM boundary and margin</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#52647a">Illustration for a two-feature classifier</text>
  <g transform="translate(105 390) scale(120 -120)">
    <rect x="-2.55" y="-2.45" width="5.1" height="4.9" fill="#f7f9fc"/>
    <polygon points="-2.45,1.45 1.45,-2.45 -0.2,-2.45 -2.45,-0.2" fill="#e8f2ff"/>
    <line x1="-2.4" y1="2.4" x2="2.4" y2="-2.4" stroke="#2f5d8a" stroke-width="0.025" stroke-dasharray="0.10,0.07"/>
    <line x1="-1.4" y1="2.4" x2="2.4" y2="-1.4" stroke="#d17b0f" stroke-width="0.035"/>
    <line x1="-2.4" y1="1.4" x2="1.4" y2="-2.4" stroke="#d17b0f" stroke-width="0.035"/>
    <line x1="-2.3" y1="-2.25" x2="2.25" y2="2.3" stroke="#2c7a55" stroke-width="0.045" marker-end="url(#arrow)"/>
    <line x1="-2.45" y1="0" x2="2.45" y2="0" stroke="#7b8794" stroke-width="0.012"/>
    <line x1="0" y1="-2.35" x2="0" y2="2.35" stroke="#7b8794" stroke-width="0.012"/>
    <circle cx="-1.4" cy="1.4" r="0.09" fill="#ffffff" stroke="#bd4b45" stroke-width="0.04"/>
    <circle cx="1.4" cy="-1.4" r="0.09" fill="#ffffff" stroke="#bd4b45" stroke-width="0.04"/>
    <circle cx="1.25" cy="1.1" r="0.09" fill="#3973ac"/>
    <circle cx="1.75" cy="0.65" r="0.09" fill="#3973ac"/>
    <circle cx="0.65" cy="1.75" r="0.09" fill="#3973ac"/>
    <circle cx="-1.2" cy="-1.25" r="0.09" fill="#d17b0f"/>
    <circle cx="-1.8" cy="-0.7" r="0.09" fill="#d17b0f"/>
    <circle cx="-0.7" cy="-1.8" r="0.09" fill="#d17b0f"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2c7a55"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25364a">
    <text x="687" y="190">+1 class</text>
    <text x="687" y="310">-1 class</text>
    <text x="430" y="127" fill="#2f5d8a">decision boundary: score = 0</text>
    <text x="430" y="150" fill="#b36a0c">margins: score = +1 and -1</text>
    <text x="430" y="173" fill="#bd4b45">support vectors lie on or inside a margin</text>
    <text x="430" y="196" fill="#2c7a55">w points perpendicular to the boundary</text>
    <text x="700" y="410">x1</text>
    <text x="93" y="112">x2</text>
  </g>
  <g transform="translate(430 265)" font-family="Arial, sans-serif" font-size="15" fill="#25364a">
    <rect x="0" y="0" width="330" height="115" rx="8" fill="#f5f7fa" stroke="#d7dee8"/>
    <text x="18" y="30" font-weight="700">Key relationships</text>
    <text x="18" y="57">score(x) = w . x + b</text>
    <text x="18" y="81">margin width = 2 / ||w||</text>
    <text x="18" y="104">geometric distance = score / ||w||</text>
  </g>
</svg>
